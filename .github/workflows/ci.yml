name: Rust compatibility foundation

on: [pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Set up native reference compiler cache
        id: reference-cache
        uses: ./.github/actions/reference-cache
      - run: bash scripts/setup-reference.sh
      - run: bash scripts/check-compatibility.sh
      - run: bash scripts/setup-snapshot-reference.sh
        env:
          REFERENCE_SOURCE: ${{ github.workspace }}/.reference/OpenTTD
      - run: bash scripts/check-snapshots.sh
      - run: bash scripts/check-simulation.sh
      - run: bash scripts/check-callbacks.sh
      - name: Report native compiler-cache statistics
        if: always() && steps.reference-cache.outcome == 'success'
        run: ccache --show-stats --verbose
