name: Rust compatibility foundation

on: [pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  interoperability:
    runs-on: ubuntu-latest
    env:
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
      REFERENCE_COMPILER_LAUNCHER: ccache
      REFERENCE_DISABLE_PCH: "ON"
      CCACHE_DIR: ${{ github.workspace }}/.reference/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ ccache zlib1g-dev liblzma-dev liblzo2-dev libpng-dev libcurl4-openssl-dev xz-utils unzip
      - name: Fingerprint the native toolchain
        id: cpp-toolchain
        shell: bash
        run: |
          fingerprint="$(
            {
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              "$CXX" --version
              cmake --version
              ccache --version
              sha256sum "$(readlink -f "$CXX")" "$("$CXX" -print-prog-name=cc1plus)"
            } | sha256sum | cut -d ' ' -f 1
          )"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore native compiler artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cpp-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cpp-toolchain.outputs.fingerprint }}-${{ hashFiles('upstream.toml', 'scripts/setup-reference.sh', 'scripts/setup-snapshot-reference.sh', 'reference/*.patch', 'reference/*.hpp', '.github/workflows/ci.yml') }}
          restore-keys: |
            cpp-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cpp-toolchain.outputs.fingerprint }}-
      - name: Initialize compiler-cache statistics
        run: |
          ccache --zero-stats
          ccache --show-config
      - run: bash scripts/setup-reference.sh
      - run: bash scripts/check-compatibility.sh
      - run: bash scripts/setup-snapshot-reference.sh
        env:
          REFERENCE_SOURCE: ${{ github.workspace }}/.reference/OpenTTD
      - run: bash scripts/check-snapshots.sh
      - run: bash scripts/check-simulation.sh
      - run: bash scripts/check-callbacks.sh
      - name: Report native compiler-cache statistics
        if: always() && steps.cpp-toolchain.outcome == 'success'
        run: ccache --show-stats --verbose
