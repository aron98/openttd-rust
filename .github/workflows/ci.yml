name: Rust compatibility foundation

on: [pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: python3 scripts/check-contract.py --validate
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: astral-sh/setup-uv@v6
      - name: Validate loader evidence checks
        run: uv run --with pytest python -m pytest scripts/tests/grf_control_evidence_test.py -q
      - name: Lint loader evidence checks
        run: |
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/grf_control*.py scripts/check-grf-control.py scripts/tests/grf_control_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/grf_control_evidence.py scripts/grf_control_run.py scripts/grf_control_guards.py scripts/grf_control_archive.py scripts/grf_control_provenance.py scripts/check-grf-control.py scripts/tests/grf_control_evidence_test.py
      - name: Validate fresh road sale evidence admission
        run: uv run --with pytest python -m pytest scripts/tests/sale_evidence_test.py scripts/tests/sale_lifetime_test.py -q
      - name: Validate context and occupancy evidence admission
        run: |
          uv run --with pytest python -m pytest scripts/tests/context_ci_evidence_test.py -q
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/context_ci_*.py scripts/occupancy_ci_evidence.py scripts/check-grf-context-ci.py scripts/check-occupancy-ci.py scripts/tests/context_ci_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/context_ci_support.py scripts/context_ci_evidence.py scripts/occupancy_ci_evidence.py scripts/check-grf-context-ci.py scripts/check-occupancy-ci.py scripts/tests/context_ci_evidence_test.py
      - name: Check road slope CI admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/road_slope_ci_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/check-road-slope-ci.py scripts/road_slope_ci_evidence.py scripts/tests/road_slope_ci_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/check-road-slope-ci.py scripts/road_slope_ci_evidence.py scripts/tests/road_slope_ci_test.py
      - name: Check static safety CI admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/safety_ci_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/check-grf-safety-ci.py scripts/safety_ci_evidence.py scripts/safety_ci_bindings.py scripts/tests/safety_ci_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/check-grf-safety-ci.py scripts/safety_ci_evidence.py scripts/safety_ci_bindings.py scripts/tests/safety_ci_evidence_test.py
      - name: Check order-state evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/order_state_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/order_state*.py scripts/check-order-state.py scripts/tests/order_state_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/order_state*.py scripts/check-order-state.py scripts/tests/order_state_evidence_test.py
      - name: Check ordered language evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/language_ci_evidence_test.py scripts/tests/empty_inputs_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/language_ci_*.py scripts/check-grf-language-ci.py scripts/grf_control_archive.py scripts/depot_build_archive.py scripts/tests/language_ci_evidence_test.py scripts/tests/empty_inputs_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/language_ci_*.py scripts/check-grf-language-ci.py scripts/grf_control_archive.py scripts/depot_build_archive.py scripts/tests/language_ci_evidence_test.py scripts/tests/empty_inputs_test.py
      - name: Check depot removal evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/depot_removal_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/depot_removal*.py scripts/check-depot-removal.py scripts/tests/depot_removal_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/depot_removal*.py scripts/check-depot-removal.py scripts/tests/depot_removal_evidence_test.py
      - name: Check ordered sale evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/ordered_sale_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/ordered_sale*.py scripts/check-ordered-sale.py scripts/tests/ordered_sale_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/ordered_sale*.py scripts/check-ordered-sale.py scripts/tests/ordered_sale_evidence_test.py
      - name: Check live-backup sale evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/backup_sale_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/backup_sale*.py scripts/check-backup-sale.py scripts/tests/backup_sale_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/backup_sale*.py scripts/check-backup-sale.py scripts/tests/backup_sale_evidence_test.py
      - name: Check session string evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/strings_ci_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/strings_ci_*.py scripts/check-grf-strings-ci.py scripts/tests/strings_ci_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/strings_ci_*.py scripts/check-grf-strings-ci.py scripts/tests/strings_ci_evidence_test.py
      - name: Check backup-enabled sale evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/backup_enabled_sale_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/backup_enabled_sale*.py scripts/check-backup-enabled-sale.py scripts/tests/backup_enabled_sale_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/backup_enabled_sale*.py scripts/check-backup-enabled-sale.py scripts/tests/backup_enabled_sale_evidence_test.py
      - name: Check currency owner evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/currency_ci_evidence_test.py scripts/tests/currency_ci_baseline_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/currency_ci_*.py scripts/check-grf-currency-ci.py scripts/tests/currency_ci_evidence_test.py scripts/tests/currency_ci_baseline_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/currency_ci_*.py scripts/check-grf-currency-ci.py scripts/tests/currency_ci_evidence_test.py scripts/tests/currency_ci_baseline_test.py
      - name: Check owned Restore evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/owned_restore_sources_test.py scripts/owned_restore_capacity_test.py scripts/owned_restore_admission_test.py scripts/owned_restore_suffix_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/owned_restore_*.py scripts/check-owned-restore.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/owned_restore_*.py scripts/check-owned-restore.py
      - name: Check tree and terrain evidence admission
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/tree_ci_evidence_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/tree_ci_*.py scripts/check-tree-terrain-ci.py scripts/tests/tree_ci_evidence_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/tree_ci_*.py scripts/check-tree-terrain-ci.py scripts/tests/tree_ci_evidence_test.py
      - name: Check evidence transport and failure diagnostics
        run: |
          uv run --with pytest python -m pytest -q scripts/tests/evidence_transport_test.py
          uvx ruff check --config scripts/grf-control-ruff.toml scripts/tests/evidence_transport_test.py
          uv run --with basedpyright --with pytest basedpyright --warnings scripts/tests/evidence_transport_test.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Set up native reference compiler cache
        id: reference-cache
        uses: ./.github/actions/reference-cache
      - run: bash scripts/setup-reference.sh
      - run: bash scripts/setup-snapshot-reference.sh
        env:
          REFERENCE_SOURCE: ${{ github.workspace }}/.reference/OpenTTD
      - name: Run the versioned compatibility baseline
        run: python3 scripts/check-contract.py --run baseline
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-contract-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .omo/evidence/contract-*/
            .omo/evidence/native-contract-*/
            .artifacts/compat-*/
            .artifacts/snapshots-*/
            .artifacts/simulation-*/
            .artifacts/callbacks-*/
            .artifacts/worlds-*/
            .artifacts/replays-*/
            .artifacts/gameplay-foundations-*/
            .artifacts/service-*/
            .artifacts/grf-metadata-*/
            .artifacts/grf-control-*/
            .artifacts/purchase-*/
            .artifacts/depot-build-*/
            .artifacts/script-vm-*/
            .artifacts/grf-context-*/
            .artifacts/grf-safety-*/
            .artifacts/depot-occupancy-*/
            .artifacts/occupancy-invocation-*/
            .artifacts/road-sale-*/
            .artifacts/road-slope-*/
            .artifacts/road-slope-invocation-*/
            .artifacts/order-state-*/
            .artifacts/depot-removal-*/
            .artifacts/backup-sale-*/
            !.artifacts/backup-sale-target-*/**
            .artifacts/owned-restore-*/
            !.artifacts/owned-restore-target-*/**
            .artifacts/backup-enabled-sale-*/
            !.artifacts/backup-enabled-sale-target-*/**
            .artifacts/ordered-sale-*/
            !.artifacts/ordered-sale-target-*/**
            .artifacts/grf-language-*/
            .artifacts/grf-strings-*/
            .artifacts/grf-currency-*/
            .artifacts/tree-terrain-*/
            !.artifacts/tree-terrain-target-*/**
      - name: Report native compiler-cache statistics
        if: always() && steps.reference-cache.outcome == 'success'
        run: ccache --show-stats --verbose
